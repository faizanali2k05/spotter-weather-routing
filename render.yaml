services:
  - type: web
    name: spotter-weather-routing-api
    runtime: docker
    repo: https://github.com/faizanali2k05/spotter-weather-routing
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'false'
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://spotter-weather-routing.vercel.app
